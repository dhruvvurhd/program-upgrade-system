name: CI - Build and Test

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-and-test:
    name: Build and Test Upgrade System
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/gq-godark/gdx-golden-image:latest
    env:
      USE_EXTERNAL_VALIDATOR: false

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Rust
        run: |
          # Use existing Rust installation from the image
          export PATH="$HOME/.cargo/bin:$PATH"
          rustup default stable || true

      - name: Verify installations
        run: |
          export PATH="$HOME/.cargo/bin:$PATH"
          rustc --version
          cargo --version
          export PATH="$HOME/.local/share/solana/install/active_release/bin:$HOME/.cargo/bin:$PATH"
          solana --version
          # Activate Anchor version manager - use 0.32.1 for this project
          yes | avm use 0.32.1 || true
          anchor --version

      - name: Disable avm toolchain override
        run: |
          # Convert CRLF to LF first (Windows line endings cause issues)
          sed -i 's/\r$//' Anchor.toml
          # Remove the toolchain section to prevent avm auto-install
          sed -i '/\[toolchain\]/,/^$/d' Anchor.toml || true
          # Show the resulting file for debugging
          echo "=== Anchor.toml after processing ==="
          cat Anchor.toml

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Node dependencies
        run: |
          npm install -g yarn
          yarn install

      - name: Create Solana keypair
        run: |
          export PATH="$HOME/.local/share/solana/install/active_release/bin:$PATH"
          mkdir -p ~/.config/solana
          solana-keygen new --outfile ~/.config/solana/id.json --no-bip39-passphrase --force
          # Generate program keypair
          mkdir -p target/deploy
          solana-keygen new --outfile target/deploy/program_upgrade_system-keypair.json --no-bip39-passphrase --force

      - name: Sync program ID
        run: |
          export PATH="$HOME/.cargo/bin:$HOME/.local/share/solana/install/active_release/bin:$PATH"
          yes | avm use 0.32.1 || true
          # Sync the program ID from keypair to lib.rs and Anchor.toml
          anchor keys sync
          echo "Program ID synced:"
          anchor keys list

      - name: Build Program
        env:
          CARGO_NET_GIT_FETCH_WITH_CLI: true
        run: |
          # Ensure system Rust is in PATH before Solana
          export PATH="$HOME/.cargo/bin:$HOME/.local/share/solana/install/active_release/bin:$PATH"
          # Activate Anchor version manager
          yes | avm use 0.32.1 || true
          # Force cargo to use stable Rust
          export RUSTUP_TOOLCHAIN=stable
          # Set rustup override to ensure stable is used
          rustup override set stable || true
          # Prevent Anchor from installing its own Rust toolchain
          export ANCHOR_SKIP_RUST_INSTALL=1
          # Time the build
          echo "⏱️ Starting build at $(date +%s)"
          BUILD_START=$(date +%s)
          anchor build || (echo "Build failed, retrying once..." && sleep 5 && anchor build)
          BUILD_END=$(date +%s)
          BUILD_TIME=$((BUILD_END - BUILD_START))
          echo "⏱️ Build completed in ${BUILD_TIME} seconds"
          echo "BUILD_TIME=${BUILD_TIME}" >> $GITHUB_ENV

      - name: Start Solana Test Validator
        run: |
          export PATH="$HOME/.local/share/solana/install/active_release/bin:$PATH"

          # Clean up any existing validator processes
          ps aux | grep -E '[s]olana-test-validator' | awk '{print $2}' | xargs -r kill -9 || true
          sleep 1

          # Start validator in background
          nohup solana-test-validator --reset --quiet > validator.log 2>&1 &
          VALIDATOR_PID=$!
          echo $VALIDATOR_PID > validator.pid
          echo "Started validator with PID: $VALIDATOR_PID"

          # Verify the process is running
          if ! kill -0 $VALIDATOR_PID 2>/dev/null; then
            echo "❌ Validator process failed to start"
            cat validator.log || true
            exit 1
          fi

          # Wait for validator to be ready
          echo "Waiting for validator to start..."
          for i in {1..60}; do
            if solana cluster-version --url http://127.0.0.1:8899 > /dev/null 2>&1; then
              echo "✓ Validator is ready!"
              break
            fi
            if [ $i -eq 60 ]; then
              echo "❌ Validator failed to start within 60 seconds"
              cat validator.log || true
              exit 1
            fi
            sleep 1
          done

          # Configure Solana CLI
          solana config set --url http://127.0.0.1:8899

          # Fund the wallet
          echo "Funding wallet..."
          for i in {1..5}; do
            if solana airdrop 100; then
              echo "✓ Wallet funded"
              break
            fi
            sleep 2
          done

      - name: Deploy Program
        run: |
          export PATH="$HOME/.cargo/bin:$HOME/.local/share/solana/install/active_release/bin:$PATH"
          yes | avm use 0.32.1 || true
          export ANCHOR_PROVIDER_URL=http://127.0.0.1:8899
          export ANCHOR_WALLET=~/.config/solana/id.json
          # Deploy without IDL to avoid IDL account creation errors
          anchor deploy --no-idl

      - name: Run Tests
        run: |
          export PATH="$HOME/.cargo/bin:$HOME/.local/share/solana/install/active_release/bin:$PATH"
          yes | avm use 0.32.1 || true
          export ANCHOR_PROVIDER_URL=http://127.0.0.1:8899
          export ANCHOR_WALLET=~/.config/solana/id.json

          echo "⏱️ Starting tests at $(date +%s)"
          TEST_START=$(date +%s)

          # Run Anchor tests (skip local validator since we started our own)
          anchor test --skip-local-validator

          TEST_END=$(date +%s)
          TEST_TIME=$((TEST_END - TEST_START))
          echo "⏱️ Tests completed in ${TEST_TIME} seconds"
          echo "TEST_TIME=${TEST_TIME}" >> $GITHUB_ENV

      - name: Show validator logs on failure
        if: failure()
        run: |
          echo "=== Validator Logs ==="
          tail -100 validator.log || true
          if [ -f validator.pid ]; then
            VALIDATOR_PID=$(cat validator.pid)
            echo "Validator PID was: $VALIDATOR_PID"
            ps aux | grep solana-test-validator || true
          fi

      - name: Build Summary
        if: always()
        run: |
          echo "## ⏱️ Build Performance Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -n "$BUILD_TIME" ]; then
            echo "**Build time:** ${BUILD_TIME} seconds" >> $GITHUB_STEP_SUMMARY
          fi
          if [ -n "$TEST_TIME" ]; then
            echo "**Test time:** ${TEST_TIME} seconds" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Test Coverage (12 Tests)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Core Workflow Tests (6 tests):**" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Initialize Multisig" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Propose Upgrade" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Approve Upgrade" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Execute Upgrade (timelock simulation)" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Cancel Upgrade" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Migrate Account" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Edge Case Tests (3 tests):**" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Prevent duplicate approval" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Prevent double cancel" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Verify proposal state" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Pause/Resume Tests (3 tests):**" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Pause system" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Resume system" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Prevent double pause" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Timelock Testing Note" >> $GITHUB_STEP_SUMMARY
          echo "The 48-hour timelock is verified by confirming the execute_upgrade" >> $GITHUB_STEP_SUMMARY
          echo "instruction correctly FAILS before timelock expiry (TimelockNotExpired error)." >> $GITHUB_STEP_SUMMARY

      - name: Stop validator
        if: always()
        run: |
          echo "Stopping validator..."
          # Try graceful shutdown first
          if [ -f validator.pid ]; then
            VALIDATOR_PID=$(cat validator.pid)
            echo "Attempting to stop validator PID: $VALIDATOR_PID"
            kill $VALIDATOR_PID 2>/dev/null || true
            sleep 2
            
            # Force kill if still running
            if kill -0 $VALIDATOR_PID 2>/dev/null; then
              echo "Force killing validator..."
              kill -9 $VALIDATOR_PID 2>/dev/null || true
            fi
            rm -f validator.pid
          fi
          # Clean up any remaining validator processes
          ps aux | grep -E '[s]olana-test-validator' | awk '{print $2}' | xargs -r kill -9 || true
          sleep 1
          echo "✓ Validator stopped"

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: program-upgrade-system-build
          path: |
            target/deploy/*.so
            target/idl/*.json
