name: CI - Build and Test

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-and-test:
    name: Build and Test Upgrade System
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust Stable 1.78
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.78.0
          profile: minimal

      - name: Install Rust Nightly
        uses: dtolnay/rust-toolchain@nightly
        with:
          toolchain: nightly-2024-11-21

      - name: Cache Cargo Registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install Solana CLI
        run: |
          sh -c "$(curl -sSfL https://release.anza.xyz/v1.18.17/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> $GITHUB_PATH

      - name: Install Anchor CLI
        run: |
          export RUSTUP_TOOLCHAIN=nightly-2024-11-21
          cargo install --git https://github.com/coral-xyz/anchor --tag v0.30.1 anchor-cli || true
          anchor --version

      - name: Disable avm toolchain override
        run: |
          sed -i '/\[toolchain\]/,/^$/d' Anchor.toml || true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "yarn"

      - name: Install Node dependencies
        run: yarn install

      - name: Build Program
        run: |
          export PATH="$HOME/.cargo/bin:$HOME/.local/share/solana/install/active_release/bin:$PATH"
          export RUSTUP_TOOLCHAIN=1.78.0
          echo "⏱️ Starting build at $(date +%s)"
          BUILD_START=$(date +%s)
          anchor build
          BUILD_END=$(date +%s)
          BUILD_TIME=$((BUILD_END - BUILD_START))
          echo "⏱️ Build completed in ${BUILD_TIME} seconds"
          echo "BUILD_TIME=${BUILD_TIME}" >> $GITHUB_ENV

      - name: Create Solana keypair
        run: |
          export PATH="$HOME/.local/share/solana/install/active_release/bin:$PATH"
          mkdir -p ~/.config/solana
          solana-keygen new --outfile ~/.config/solana/id.json --no-bip39-passphrase --force

      - name: Start Solana Test Validator
        run: |
          export PATH="$HOME/.local/share/solana/install/active_release/bin:$PATH"

          # Start validator in background
          nohup solana-test-validator --reset --quiet > validator.log 2>&1 &
          VALIDATOR_PID=$!
          echo $VALIDATOR_PID > validator.pid
          echo "Started validator with PID: $VALIDATOR_PID"

          # Wait for validator to be ready
          echo "Waiting for validator to start..."
          for i in {1..60}; do
            if solana cluster-version --url http://127.0.0.1:8899 > /dev/null 2>&1; then
              echo "✓ Validator is ready!"
              break
            fi
            if [ $i -eq 60 ]; then
              echo "❌ Validator failed to start within 60 seconds"
              cat validator.log || true
              exit 1
            fi
            sleep 1
          done

          # Configure Solana CLI
          solana config set --url http://127.0.0.1:8899

          # Fund the wallet
          echo "Funding wallet..."
          for i in {1..5}; do
            if solana airdrop 100; then
              echo "✓ Wallet funded"
              break
            fi
            sleep 2
          done

      - name: Deploy Program
        run: |
          export PATH="$HOME/.cargo/bin:$HOME/.local/share/solana/install/active_release/bin:$PATH"
          export ANCHOR_PROVIDER_URL=http://127.0.0.1:8899
          export ANCHOR_WALLET=~/.config/solana/id.json
          anchor deploy

      - name: Run Tests
        run: |
          export PATH="$HOME/.cargo/bin:$HOME/.local/share/solana/install/active_release/bin:$PATH"
          export ANCHOR_PROVIDER_URL=http://127.0.0.1:8899
          export ANCHOR_WALLET=~/.config/solana/id.json

          echo "⏱️ Starting tests at $(date +%s)"
          TEST_START=$(date +%s)

          # Run Anchor tests (skip local validator since we started our own)
          anchor test --skip-local-validator

          TEST_END=$(date +%s)
          TEST_TIME=$((TEST_END - TEST_START))
          echo "⏱️ Tests completed in ${TEST_TIME} seconds"
          echo "TEST_TIME=${TEST_TIME}" >> $GITHUB_ENV

      - name: Show validator logs on failure
        if: failure()
        run: |
          echo "=== Validator Logs ==="
          tail -100 validator.log || true

      - name: Build Summary
        if: always()
        run: |
          echo "## ⏱️ Build Performance Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -n "$BUILD_TIME" ]; then
            echo "**Build time:** ${BUILD_TIME} seconds" >> $GITHUB_STEP_SUMMARY
          fi
          if [ -n "$TEST_TIME" ]; then
            echo "**Test time:** ${TEST_TIME} seconds" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Test Coverage (12 Tests)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Core Workflow Tests (6 tests):**" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Initialize Multisig" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Propose Upgrade" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Approve Upgrade" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Execute Upgrade (timelock simulation)" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Cancel Upgrade" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Migrate Account" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Edge Case Tests (3 tests):**" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Prevent duplicate approval" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Prevent double cancel" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Verify proposal state" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Pause/Resume Tests (3 tests):**" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Pause system" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Resume system" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Prevent double pause" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Timelock Testing Note" >> $GITHUB_STEP_SUMMARY
          echo "The 48-hour timelock is verified by confirming the execute_upgrade" >> $GITHUB_STEP_SUMMARY
          echo "instruction correctly FAILS before timelock expiry (TimelockNotExpired error)." >> $GITHUB_STEP_SUMMARY

      - name: Stop validator
        if: always()
        run: |
          if [ -f validator.pid ]; then
            VALIDATOR_PID=$(cat validator.pid)
            kill $VALIDATOR_PID 2>/dev/null || true
            sleep 1
            kill -9 $VALIDATOR_PID 2>/dev/null || true
            rm -f validator.pid
          fi
          pkill -f solana-test-validator || true
          echo "✓ Validator stopped"

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: program-upgrade-system-build
          path: |
            target/deploy/*.so
            target/idl/*.json
