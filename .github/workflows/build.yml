name: Build Solana Program

on:
  push:
    branches: [ main, master, feature/ci-testing ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/gq-godark/gdx-golden-image:latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup Rust
      run: |
        # Use existing Rust installation from the image
        export PATH="$HOME/.cargo/bin:$PATH"
        rustup default stable || true

    - name: Verify installations
      run: |
        export PATH="$HOME/.cargo/bin:$PATH"
        rustc --version
        cargo --version
        export PATH="$HOME/.local/share/solana/install/active_release/bin:$HOME/.cargo/bin:$PATH"
        solana --version
        # Activate Anchor version manager - use 0.32.1 from golden image
        yes | avm use 0.32.1 || true
        anchor --version

    # Remove AVM toolchain override to prevent version conflicts
    - name: Disable avm in Anchor.toml
      run: |
        sed -i '/\[toolchain\]/,/^$/d' Anchor.toml || true

    # Build Anchor program using stable Rust
    - name: Build Program
      env:
        CARGO_NET_GIT_FETCH_WITH_CLI: true
      run: |
        export PATH="$HOME/.cargo/bin:$HOME/.local/share/solana/install/active_release/bin:$PATH"
        yes | avm use 0.32.1 || true
        # Force cargo to use stable Rust
        export RUSTUP_TOOLCHAIN=stable
        rustup override set stable || true
        export ANCHOR_SKIP_RUST_INSTALL=1
        anchor build

    # Copy .so + IDL artifacts
    - name: Copy artifacts
      run: |
        mkdir -p artifacts
        cp target/deploy/*.so artifacts/ 2>/dev/null || echo "No artifacts found"
        ls -la target/deploy/ || true

    # Upload artifacts
    - uses: actions/upload-artifact@v4
      with:
        name: program-build
        path: |
          artifacts/*.so
          target/idl/*.json
